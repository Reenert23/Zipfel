<mat-sidenav-container autosize class="example-container">
  <mat-sidenav #sidenav mode="over" opened class="glass-sidenav">
    <div class="sidenav-brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">Zipfel</span>
    </div>
    <mat-nav-list>
      <a mat-list-item href="/">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item (click)="goToRounds()">
        <mat-icon matListItemIcon>style</mat-icon>
        <span matListItemTitle>Runden</span>
      </a>
      <a mat-list-item href="/contact">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Contact</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="glass-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="brand">ZIPFEL</span>
      <span class="toolbar-spacer"></span>
      <button *ngIf="isGameListRoute" mat-icon-button (click)="openPlayerSelector()" aria-label="Spieler ändern">
        <mat-icon>group</mat-icon>
      </button>
    </mat-toolbar>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
