<mat-sidenav-container autosize class="example-container">
  <mat-sidenav #sidenav mode="over" opened>
    <mat-nav-list>
      <a mat-list-item href="/">Home</a>
      <a mat-list-item (click)="goToRounds()">Runden</a>
      <a mat-list-item href="/contact">Contact</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>ZIPFEL</span>
    </mat-toolbar>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
