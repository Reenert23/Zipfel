<mat-sidenav-container autosize class="example-container">
  <mat-sidenav #sidenav mode="over" opened class="glass-sidenav">
    <div class="sidenav-brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">Zipfel</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item routerLink="/play">
        <mat-icon matListItemIcon>sports_esports</mat-icon>
        <span matListItemTitle>Spielen</span>
      </a>
      <a mat-list-item routerLink="/rounds">
        <mat-icon matListItemIcon>style</mat-icon>
        <span matListItemTitle>Runden</span>
      </a>
      <a mat-list-item routerLink="/stats">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Statistiken</span>
      </a>
      <a mat-list-item routerLink="/contact">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Contact</span>
      </a>
      <a mat-list-item routerLink="/database-admin">
        <mat-icon matListItemIcon>storage</mat-icon>
        <span matListItemTitle>DB Admin</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <!-- Die Glasebene der Toolbar, bewusst als eigenes Element daneben und
         nicht als Hintergrund der Toolbar selbst: iOS rastert fuer einen
         backdrop-filter den ganzen Stacking-Context und nimmt den Text darin
         mit, der dadurch sichtbar weich wird. Als Geschwister liegt der
         Filter ausserhalb des Elternbaums der Schrift. -->
    <div class="toolbar-glass" aria-hidden="true"></div>
    <mat-toolbar class="glass-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="brand" *ngIf="!isDashboard">ZIPFEL</span>
      <span class="toolbar-spacer"></span>
      <!-- Wartet, statt die laufende Runde mit einem Reload zu unterbrechen. -->
      <button *ngIf="updateBereit" class="update-hinweis" (click)="jetztAktualisieren()"
              aria-label="Neue Version laden">
        Neue Version
      </button>
      <span class="version" style="font-size: 0.75em; opacity: 0.7; margin-right: 12px;">{{ version }}</span>
      <button *ngIf="isGameListRoute" mat-icon-button (click)="openPlayerSelector()" aria-label="Spieler ändern">
        <mat-icon>group</mat-icon>
      </button>
    </mat-toolbar>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
