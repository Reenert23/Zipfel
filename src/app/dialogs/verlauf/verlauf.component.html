<h2 mat-dialog-title>Verlauf</h2>

<div mat-dialog-content>
  <app-points-chart
    [games]="games"
    [players]="players">
  </app-points-chart>

  <div class="hinweis" *ngIf="games.length === 0">
    Noch kein Spiel eingetragen.
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">Fertig</button>
</div>
