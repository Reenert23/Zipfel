<div class="container">
  <!-- Gewinner auswählen -->
  <div class="winner-section">
    <div class="winner-selection">
      <button mat-raised-button color="primary"
        *ngFor="let slot of playerSlots; let i = index"
        [style.gridArea]="getGridArea(i)"
        (click)="slot && toggleWinner(slot.firstName)"
        [class.selected]="slot && selectedWinners.includes(slot.firstName)"
        [ngClass]="{'red-button': clickCount % 2 === 0 && clickCount !== 0}">
        {{ slot?.firstName || '' }}
      </button>
    </div>
  </div>
  <div class="button-group">
    <button mat-raised-button color="accent" (click)="setMaxWinners('Ruf')" [class.selected]="gameType === 'Ruf'">Ruf</button>
    <button mat-raised-button color="accent" (click)="setMaxWinners('Solo')" [class.selected]="gameType === 'Solo'" [ngClass]="{'red-button': gameType === 'Solo' && clickCount % 2 === 0 && clickCount !== 0}">Solo</button>
    <button mat-raised-button color="accent" (click)="setMaxWinners('Geier')" [class.selected]="gameType === 'Geier'" [ngClass]="{'red-button': gameType === 'Geier' && clickCount % 2 === 0 && clickCount !== 0}">Geier</button>
    <button mat-raised-button color="accent" (click)="setMaxWinners('Ramsch'); openRamschDialog()">Ramsch</button>
  </div>

  <!-- Modifier-Buttons -->
  <div class="modifier-group" *ngIf="gameType !== ''">
    <button class="modifier-btn" [class.active-tout]="isTout"
      *ngIf="gameType === 'Solo' || gameType === 'Geier'"
      (click)="isTout = !isTout">Tout</button>
    <button class="modifier-btn" [class.active-schneider]="isSchneider && !isSchwarz"
      (click)="toggleSchneider()">Schneider</button>
    <button class="modifier-btn" [class.active-schwarz]="isSchwarz"
      (click)="toggleSchwarz()">Schwarz</button>
    <span class="multiplier-display" *ngIf="getMultiplier() > 1">×{{ getMultiplier() }}</span>
  </div>


  <!-- Punkte-Eingabe -->
  <mat-form-field appearance="outline" class="points-input">
    <input matInput id="points" type="number" inputmode="numeric" [(ngModel)]="pointsInput" />
  </mat-form-field>


  <div class="grid-container">
    <!-- <div class="image-placeholder">
      <mat-card class="image-card">
        <img src="assets/images/wurst.jpeg" alt="Image" />
      </mat-card>
    </div> -->
    <div class="keypad">
      <div class="key-row">
        <button mat-raised-button class="key-button" (click)="addToInput(1)">1</button>
        <button mat-raised-button class="key-button" (click)="addToInput(2)">2</button>
        <button mat-raised-button class="key-button" (click)="addToInput(3)">3</button>
      </div>
      <div class="key-row">
        <button mat-raised-button class="key-button" (click)="addToInput(4)">4</button>
        <button mat-raised-button class="key-button" (click)="addToInput(5)">5</button>
        <button mat-raised-button class="key-button" (click)="addToInput(6)">6</button>
      </div>
      <div class="key-row">
        <button mat-raised-button class="key-button" (click)="addToInput(7)">7</button>
        <button mat-raised-button class="key-button" (click)="addToInput(8)">8</button>
        <button mat-raised-button class="key-button" (click)="addToInput(9)">9</button>
      </div>
      <div class="key-row">
        <button mat-raised-button class="key-button ok-button" (click)="clearInput()">C</button>
        <button mat-raised-button class="key-button" (click)="addToInput(0)">0</button>
        <button mat-raised-button class="key-button ok-button" (click)="addGame()">OK</button>
      </div>
    </div>
  </div>

  <!-- Zwischenstand -->
  <div class="scoreboard" *ngIf="players.length > 0">
    <div class="score-item" *ngFor="let player of players">
      <span class="score-name">{{ player.firstName }}</span>
      <span class="score-value"
        [class.positive]="(totalPoints[player.id] || 0) > 0"
        [class.negative]="(totalPoints[player.id] || 0) < 0">
        {{ (totalPoints[player.id] || 0) > 0 ? '+' : '' }}{{ totalPoints[player.id] || 0 }}
      </span>
    </div>
  </div>

  <!-- Tabelle der Spiele -->
  <div class="table-section">
    <button class="icon-action-btn undo-btn" (click)="deleteLastGame()" aria-label="Letztes Spiel rückgängig machen">&#9100;</button>
    <div class="tableContainer">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table">
      <!-- Spiel Column -->
      <ng-container matColumnDef="game">
        <th mat-header-cell *matHeaderCellDef class="mat-sticky">Spiel</th>
        <td mat-cell *matCellDef="let row" [ngClass]="{
          'solo-row': row.gameType === 'Solo',
          'ruf-row': row.gameType === 'Ruf',
          'geier-row': row.gameType === 'Geier',
          'ramsch-row': row.gameType === 'Ramsch'
        }">
          <span class="game-badge">{{ getGameNumber(row) }}</span>
          <div class="game-markers">
            <span class="marker marker-tout" *ngIf="row.tout">T</span>
            <span class="marker marker-schwarz" *ngIf="row.schwarz">Sz</span>
            <span class="marker marker-schneider" *ngIf="row.schneider && !row.schwarz">Sn</span>
          </div>
        </td>
        <td mat-footer-cell *matFooterCellDef> <span class="game-badge sum-badge">&#8721;</span> </td>
      </ng-container>

      <!-- Personen Columns -->
      <ng-container *ngFor="let player of players" matColumnDef="{{ player.firstName }}">
        <!-- Kopfzelle -->
        <th mat-header-cell *matHeaderCellDef
            class="mat-sticky player-header">
          {{ player.firstName }}
        </th>

        <!-- Datenzelle -->
        <td mat-cell *matCellDef="let row" [ngClass]="{
          'solo-row': row.gameType === 'Solo',
          'ruf-row': row.gameType === 'Ruf',
          'geier-row': row.gameType === 'Geier',
          'ramsch-row': row.gameType === 'Ramsch'
        }">
          <div class="points-cell" [ngClass]="{ 'geber': isGeber(row, player) }">
            <span class="indicator-slot">
              <span *ngIf="row.gameType === 'Solo' && row.soloCaller === player.id"
                [ngClass]="{
                  'green-circle': getPointsForSoloCircle(row, player.id) > 0,
                  'red-circle': getPointsForSoloCircle(row, player.id) < 0
                }">
              </span>
            </span>
            <span class="points-value"
              [class.positive]="getPointsForPlayer(row, player.id) > 0"
              [class.negative]="getPointsForPlayer(row, player.id) < 0">{{ getPointsForPlayer(row, player.id) }}</span>
            <!-- Invisible mirror of the indicator slot so the number stays centered
                 whether or not the real indicator is shown on the left. -->
            <span class="indicator-slot" aria-hidden="true"></span>
          </div>
        </td>

        <!-- Footerzelle -->
        <td mat-footer-cell *matFooterCellDef>
          <span class="points-value"
            [class.positive]="(totalPoints[player.id] || 0) > 0"
            [class.negative]="(totalPoints[player.id] || 0) < 0">{{ totalPoints[player.id] || 0 }}</span>
        </td>
      </ng-container>

      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="mat-sticky"></tr>
      <!-- Data Row -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
    </div>
  </div>
</div>
