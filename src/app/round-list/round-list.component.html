<div class="round-list">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="header">
    <button class="glass-btn icon-btn" (click)="goToGames()" aria-label="zurück">
      <span class="arrow">←</span>
    </button>
    <h1 class="page-title">Runden</h1>
  </div>

  <div class="rounds-grid" *ngIf="rounds.length; else emptyState">
    <div class="round-card" *ngFor="let round of rounds; let i = index" (click)="goToRound(round)">
      <div class="round-card-header">
        <h3>Runde {{ i + 1 }}</h3>
        <span class="round-date">{{ round.date | date:'dd.MM.yyyy, HH:mm' }}</span>
      </div>

      <div class="player-chips">
        <div class="player-chip" *ngFor="let player of round.players">
          <span class="player-name">{{ player.firstName }}</span>
          <span
            class="player-points"
            [class.positive]="getTotalPointsForPlayer(round, player) > 0"
            [class.negative]="getTotalPointsForPlayer(round, player) < 0"
          >{{ getTotalPointsForPlayer(round, player) }}</span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <p>Noch keine Runden gespielt</p>
    </div>
  </ng-template>

  <button class="glass-btn fab" (click)="neueRundeStarten()" aria-label="neue Runde">
    <span class="plus">+</span>
  </button>
</div>
