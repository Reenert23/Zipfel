<!--
  Zipfel app icon - rounded variant, used for the "any" purpose PWA icons.

  Picks up the two-card logo from the dashboard header, but with solid cards
  instead of 2px outlines: at the ~48px a launcher actually renders, thin
  strokes disappear. The pip is an Eichel (acorn), the highest suit of the
  Bavarian deck Schafkopf is played with - it is drawn as a path rather than
  set as text so it does not depend on a font being installed.

  PNGs are generated from this file, see tools/generate-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#241f4d"/>
      <stop offset="1" stop-color="#141b3d"/>
    </linearGradient>
    <!-- Brand gradient, same one the .brand-mark and the ZIPFEL wordmark use. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Eichel keeps its traditional brown rather than a palette colour. -->
    <linearGradient id="eichel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6a552"/>
      <stop offset="1" stop-color="#a9622a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Eichel card, behind and tilted right -->
  <g transform="translate(320 246) rotate(14)">
    <rect x="-85" y="-119" width="170" height="238" rx="22" fill="#f8fafc"/>
    <g transform="translate(36 -50) scale(0.95) translate(-50,-48)" fill="url(#eichel)">
      <path d="M31 47 C31 70 37 85 50 93 C63 85 69 70 69 47 Z"/>
      <path d="M20 49 C20 31 33 20 50 20 C67 20 80 31 80 49 Z"/>
      <path d="M45.5 6 C45.5 3 54.5 3 54.5 6 L54.5 21 L45.5 21 Z"/>
      <!-- Splits cap from nut, otherwise the acorn is one blob when small. -->
      <path d="M20 49 L80 49" stroke="#f8fafc" stroke-width="4.5"/>
    </g>
  </g>
  <!-- Z card, in front and tilted left. The stroke in the background colour
       keeps the two cards apart instead of letting them melt together. -->
  <g transform="translate(212 276) rotate(-14)">
    <rect x="-85" y="-119" width="170" height="238" rx="22" fill="#f8fafc"
          stroke="#1b1740" stroke-width="16" paint-order="stroke"/>
    <path transform="scale(0.52) translate(-256,-256)" fill="url(#brand)"
          d="M150 140 L362 140 L362 188 L214 324 L362 324 L362 372 L150 372 L150 324 L298 188 L150 188 Z"/>
  </g>
</svg>
