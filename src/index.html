<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- iOS paints the strip below the standalone web view in this colour. It is
       matched to the tone the page gradients end on, so the area iOS keeps for
       itself stops reading as a foreign band. -->
  <meta name="theme-color" content="#1b3a63">
  <!-- EXPERIMENT, revert if it does not help.
       Standalone, iOS hands the app a 793pt web view on an 852pt screen and
       keeps the bottom 59pt for itself. Removing the manifest from the install
       did not change that, so this is the opposite test: drop the legacy
       apple-mobile-web-app-capable flag and let the manifest's
       display: standalone drive the install on its own (iOS 16.4+). If the two
       paths size the window differently, this is where it shows.
  <meta name="apple-mobile-web-app-capable" content="yes"> -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Label shown under the icon once iOS adds the app to the home screen. -->
  <meta name="apple-mobile-web-app-title" content="Zipfel">
  <title>Zipfel</title>
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <!-- iOS never reads the web app manifest, it only looks for this link. -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
