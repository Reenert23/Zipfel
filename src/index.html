<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- iOS paints the status bar area above the standalone web view in this
       colour. It is the exact background of .glass-toolbar in
       app.component.css, which is a flat opaque colour for this reason - the
       two meet edge to edge and any difference shows up as a band. Change one,
       change the other, and the manifest's theme_color with them. -->
  <meta name="theme-color" content="#171432">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- No apple-mobile-web-app-status-bar-style. Measured on the device against
       an older home screen icon that still rendered edge to edge: iOS hands the
       standalone app a 793pt window on an 852pt screen either way. It never
       grows that window to the full screen - black-translucent only moves it up
       under the status bar, and the 59pt it does not cover drop off the bottom,
       where the scrolling page content made them impossible to hide. Left out,
       the same window sits below the status bar and reaches the bottom edge.
       iOS stores this at the time the icon is added to the home screen, so
       changing it only takes effect for a newly added icon.
       The layout follows on its own: toolbar height and content offset are
       derived from env(safe-area-inset-top) in app.component.css, which is now
       0 rather than 59. -->
  <!-- Label shown under the icon once iOS adds the app to the home screen. -->
  <meta name="apple-mobile-web-app-title" content="Zipfel">
  <title>Zipfel</title>
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <!-- iOS never reads the web app manifest, it only looks for this link. -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
